# Builds Dave browz for the iPhone Simulator on a GitHub Mac, opens real websites in it,
# and records what each site served: screenshots plus what the page reports about itself
# (browser identity, layout width, zoom). No signing or Apple account needed.
name: Simulator desktop-site test

on:
  push:
    branches: ['claude/**']
    paths-ignore: ['README.md', 'test-results/**']
  workflow_dispatch:

concurrency:
  group: simulator-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: npm ci
      - run: npx tsc --noEmit

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build for iOS Simulator (Release, JS bundled in)
        run: |
          set +e
          xcodebuild \
            -workspace ios/Davebrowz.xcworkspace \
            -scheme Davebrowz \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*DesktopWeb|BUILD (SUCCEEDED|FAILED)" build.log | head -100
          exit $status

      - name: Open websites in the simulator
        run: |
          set -x
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=com.bluecollarmedia.davebrowz
          mkdir -p results
          run_site () {
            NAME=$1; URL=$2; ZOOM=$3
            xcrun simctl terminate "$DEVICE" $BUNDLE || true
            DATA=$(xcrun simctl get_app_container "$DEVICE" $BUNDLE data)
            rm -f "$DATA/Documents/desktop-test.jsonl"
            SIMCTL_CHILD_DESKTOP_TEST_URL="$URL" SIMCTL_CHILD_DESKTOP_TEST_REPORT=1 SIMCTL_CHILD_DESKTOP_TEST_ZOOM=$ZOOM \
              xcrun simctl launch "$DEVICE" $BUNDLE
            sleep 30
            xcrun simctl io "$DEVICE" screenshot --type=jpeg "results/$NAME.jpg"
            if [ -n "$ZOOM" ]; then
              sleep 12
              xcrun simctl io "$DEVICE" screenshot --type=jpeg "results/$NAME-zoomed.jpg"
            fi
            cp "$DATA/Documents/desktop-test.jsonl" "results/$NAME.jsonl" 2>/dev/null || echo '{"error":"no report"}' > "results/$NAME.jsonl"
            echo "=== $NAME"; cat "results/$NAME.jsonl"
          }
          run_site wikipedia https://en.wikipedia.org/wiki/IPhone 1
          run_site amazon https://www.amazon.com/
          run_site youtube https://www.youtube.com/
          run_site reddit https://www.reddit.com/
          run_site github https://github.com/
          run_site apple https://www.apple.com/
          run_site google https://www.google.com/search?q=desktop+browser
          run_site bbc https://www.bbc.com/
          run_site ebay https://www.ebay.com/

      - name: Save results to the branch
        if: always()
        run: |
          [ -d results ] || exit 0
          for f in results/*.jpg; do sips -Z 1100 -s formatOptions 70 "$f" >/dev/null || true; done
          rm -rf test-results && mkdir test-results && cp results/* test-results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results
          git commit -m "Simulator test results for ${GITHUB_SHA::7}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results
          path: |
            results/
            build.log
